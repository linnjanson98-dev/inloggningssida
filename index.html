<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Inloggningssida</title>
</head>
<body>
    <header> 
        <img src="SvampletarnaBild.png" alt="Header-bild på svamp">
        <h1>Svampletarnas föreningssida</h1>
    </header>

    <main>
        <p id="felmeddelande">Felaktiga inloggningsuppgifter</p>
        <form>
            <h2>Inloggning</h2>
            <label for="username">Namn: </label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="psw">Lösenord:</label>
            <input type="password" id="psw" name="psw" required><br><br>

            <input type="submit" value="Logga in"> 

        </form>

        <form id="inloggad">
            <h2 id="welcomeMessage"></h2><br><br>
            <input type="submit" value="Logga ut">
        </form>

    </main>
</body>
</html>
